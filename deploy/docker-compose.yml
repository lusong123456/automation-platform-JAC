# 平台编排：web（FastAPI + pytest 执行器）+ nginx（唯一入口，宿主 8080）
# 使用前：cp .env.example .env 并填写 BASE_URL、被测环境登录认证
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    env_file: .env
    environment:
      DATA_DIR: /app/data
      BASE_URL: ${BASE_URL}
    volumes:
      # 读写：SQLite、执行工作目录、报告
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "18082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 只读：仅用于直接托管 /reports 静态报告
      - ./data:/data:ro
    depends_on:
      - web
    restart: unless-stopped
