# 平台唯一入口（宿主 8080）：
#   /api/     → 反代 web:8000
#   /reports/ → 直读只读数据卷，返回 Allure 静态报告
#   /         → 反代 web:8000（前端静态资源）
server {
    listen 80;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        # SSE 流式推送：禁用 nginx buffering，让 chunk 实时穿透给前端
        proxy_buffering off;
        proxy_cache off;
        # ai-draft 等长耗时接口需要足够大的超时（审核链路最多 5 分钟）
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Allure 报告：直读只读数据卷，不经应用层
    location /reports/ {
        alias /data/reports/;
        index index.html;
        autoindex off;
    }

    # 前端静态资源与其余请求交由 FastAPI 处理
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }
}
